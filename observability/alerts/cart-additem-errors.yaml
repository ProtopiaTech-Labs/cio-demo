groups:
  - name: cart-additem-errors
    interval: 1m
    rules:
      # Cause-side signal for the cart: AddItem server spans that end with an error.
      # CartAddFailing (shop-symptoms.yaml) only sees the shopper symptom; this rule
      # points at the cart service directly (incident #29).
      - uid: cart-additem-errors
        title: CartAddItemErrors
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: |-
                (
                  sum(rate(traces_spanmetrics_calls_total{k8s_namespace_name="${NAMESPACE}", service_name="cart", span_name="POST /oteldemo.CartService/AddItem", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[2m]))
                  /
                  sum(rate(traces_spanmetrics_calls_total{k8s_namespace_name="${NAMESPACE}", service_name="cart", span_name="POST /oteldemo.CartService/AddItem", span_kind="SPAN_KIND_SERVER"}[2m]))
                ) or vector(0)
              instant: true
              range: false
              editorMode: code
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.05
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Cart AddItem server spans fail
          description: "{{ humanizePercentage $values.A.Value }} of AddItem server spans of cart in ${NAMESPACE} end with an error (2m)."
        notification_settings:
          receiver: platform-alertmanager
