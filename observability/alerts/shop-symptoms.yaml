groups:
  - name: shop-symptoms
    interval: 1m
    rules:
      # What a shopper sees: adding to the cart returns a server error. Symptom only, so
      # it says nothing about what changed. Label sre_agent=dispatch hands the alert to
      # the SRE agent.
      - uid: cart-add-errors
        title: CartAddFailing
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: |-
                (
                  sum(rate(app_frontend_requests_total{namespace="${NAMESPACE}", target="/api/cart", method="POST", status=~"5.."}[2m]))
                  /
                  sum(rate(app_frontend_requests_total{namespace="${NAMESPACE}", target="/api/cart", method="POST"}[2m]))
                ) or vector(0)
              instant: true
              range: false
              editorMode: code
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.05
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          sre_agent: dispatch
        annotations:
          summary: Adding items to the cart fails
          description: '{{ humanizePercentage $values.A.Value }} of "add to cart" requests in ${NAMESPACE} return a server error (2m).'
        notification_settings:
          receiver: platform-alertmanager
      # Placing an order returns a server error (frontend POST /api/checkout). Symptom
      # only; added for the harder agent scenarios (ai-sre/trudniejsze-demo-kandydaci.md).
      # Checkout traffic is low (~5/min), hence the wider window and 10% threshold.
      - uid: checkout-errors
        title: CheckoutFailing
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: |-
                (
                  sum(rate(app_frontend_requests_total{namespace="${NAMESPACE}", target="/api/checkout", method="POST", status=~"5.."}[5m]))
                  /
                  sum(rate(app_frontend_requests_total{namespace="${NAMESPACE}", target="/api/checkout", method="POST"}[5m]))
                ) or vector(0)
              instant: true
              range: false
              editorMode: code
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.1
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          sre_agent: dispatch
        annotations:
          summary: Placing an order fails
          description: '{{ humanizePercentage $values.A.Value }} of "place order" requests in ${NAMESPACE} return a server error (5m).'
        notification_settings:
          receiver: platform-alertmanager
      # Placing an order got slow: p95 of the checkout service's PlaceOrder server span.
      # Baseline p95 ≈ 0.95 s (2026-11-28, 6 h max 0.97 s).
      - uid: checkout-slow
        title: CheckoutSlow
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: |-
                histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{k8s_namespace_name="${NAMESPACE}", service_name="checkout", span_kind="SPAN_KIND_SERVER", span_name="oteldemo.CheckoutService/PlaceOrder"}[5m]))) or vector(0)
              instant: true
              range: false
              editorMode: code
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 1.6
        for: 3m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          sre_agent: dispatch
        annotations:
          summary: Placing an order is slow
          description: 'p95 of placing an order in ${NAMESPACE} is {{ humanizeDuration $values.A.Value }} (5m).'
        notification_settings:
          receiver: platform-alertmanager
