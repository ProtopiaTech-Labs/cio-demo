# CIO demo additions to deploy/values.yaml (shared with the SRE lab).
components:
  # The base image from the fork ships Chromium, and the chart turns browser traffic on:
  # headless browsers took the pod past 1200Mi (OOMKilled). HTTP users only; the list
  # replaces values.yaml's, so its entries are repeated.
  load-generator:
    envOverrides:
      - name: LOCUST_USERS
        value: "10"
      - name: LOG_LEVEL
        value: "ERROR"
      - name: OTEL_LOGS_EXPORTER
        value: "otlp"
      - name: LOCUST_BROWSER_TRAFFIC_ENABLED
        value: "false"

  # values.yaml (shared with the SRE lab) points the frontend at shipping:50050 on
  # purpose: that is SRE lab fault #4. The demo has no faults in its base (shipping
  # serves 8080), so the address is corrected here; the list replaces values.yaml's, so
  # its entries are repeated.
  frontend:
    envOverrides:
      - name: SHIPPING_ADDR
        value: http://shipping:8080
      - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        value: "/otlp-http/v1/traces"
      - name: OTEL_LOGS_EXPORTER
        value: otlp
      - name: PYROSCOPE_APPLICATION_NAME
        value: "{{ .Release.Namespace }}.frontend"

  # Rollout marker (see deploy/deploy.sh). The chart reads replicas with `default`, so
  # 0 would become 1; one pause container is the smallest it gets.
  rollout-marker:
    enabled: true
    useDefault:
      env: false
    imageOverride:
      repository: registry.k8s.io/pause
      tag: "3.10"
    resources:
      requests:
        cpu: 1m
        memory: 4Mi
      limits:
        memory: 8Mi
