name: CodeQL

# Code scanning of every language in the shop. Advanced setup instead of GitHub's
# default setup: default setup builds Java/Kotlin with autobuild, which cannot build ad
# and fraud-detection (Gradle with generated protobuf), and skips C++ and Rust.
# build-mode none reads the sources without building them (Kotlin code is not analysed
# in that mode); Go needs a build and gets autobuild. Not a required check: results go
# to Security -> Code scanning, new alerts show on pull requests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: actions, build-mode: none }
          - { language: c-cpp, build-mode: none }
          - { language: csharp, build-mode: none }
          - { language: go, build-mode: autobuild }
          - { language: java-kotlin, build-mode: none }
          - { language: javascript-typescript, build-mode: none }
          - { language: python, build-mode: none }
          - { language: ruby, build-mode: none }
          - { language: rust, build-mode: none }
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
